<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgExpl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2a"/>
      <stop offset="60%" stop-color="#142c48"/>
      <stop offset="100%" stop-color="#0a1624"/>
    </linearGradient>
    <pattern id="isoGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#234a6f" stroke-width="0.8" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgExpl)"/>
  <rect width="1200" height="800" fill="url(#isoGrid)"/>

  <!-- Geophysical Field Survey Vector Graphic -->
  <g transform="translate(100, 100)">
    <!-- Topographic Contour Map Lines -->
    <path d="M 50 400 Q 250 200 500 350 T 950 220" stroke="#3b6991" stroke-width="2" fill="none"/>
    <path d="M 50 460 Q 300 280 550 410 T 950 300" stroke="#4a7faa" stroke-width="1.5" fill="none"/>
    <path d="M 50 520 Q 350 360 600 470 T 950 380" stroke="#6e9ec5" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <path d="M 50 580 Q 400 440 650 530 T 950 460" stroke="#234a6f" stroke-width="1" fill="none"/>

    <!-- Geological Survey Core Rig Silhouette -->
    <g transform="translate(520, 200)">
      <!-- Mast -->
      <polygon points="40,0 30,220 50,220" fill="#c98b2f"/>
      <line x1="40" y1="0" x2="10" y2="220" stroke="#e5be7e" stroke-width="1.5"/>
      <line x1="40" y1="0" x2="70" y2="220" stroke="#e5be7e" stroke-width="1.5"/>
      <rect x="0" y="210" width="80" height="30" rx="3" fill="#122740" stroke="#c98b2f" stroke-width="1.5"/>
      <!-- Core Barrel / Drill String into Subsurface -->
      <line x1="40" y1="240" x2="40" y2="450" stroke="#fff" stroke-width="2" stroke-dasharray="6 3"/>
      <circle cx="40" cy="450" r="6" fill="#c98b2f"/>
    </g>

    <!-- Geological Core Sample Tray Silhouette -->
    <g transform="translate(120, 320)">
      <rect width="280" height="140" rx="4" fill="#08111c" stroke="#2d5f8a" stroke-width="1.5"/>
      <!-- Cylindrical Drill Cores in Tray -->
      <rect x="20" y="20" width="240" height="18" rx="4" fill="#6e9ec5" opacity="0.8"/>
      <rect x="20" y="48" width="240" height="18" rx="4" fill="#c98b2f" opacity="0.9"/>
      <rect x="20" y="76" width="240" height="18" rx="4" fill="#b47720" opacity="0.85"/>
      <rect x="20" y="104" width="240" height="18" rx="4" fill="#3b6991" opacity="0.7"/>
    </g>

    <!-- Subsurface Waveform / Sensor Vectors -->
    <g transform="translate(680, 360)">
      <rect width="240" height="120" rx="4" fill="#060c14" stroke="#c98b2f" stroke-width="1"/>
      <path d="M 15 60 Q 40 10 65 60 T 115 60 T 165 20 T 215 60" fill="none" stroke="#d9a555" stroke-width="2"/>
    </g>
  </g>
</svg>
