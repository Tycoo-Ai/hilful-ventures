<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHSE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c14"/>
      <stop offset="50%" stop-color="#0a1826"/>
      <stop offset="100%" stop-color="#04090f"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b395d"/>
      <stop offset="50%" stop-color="#0e2034"/>
      <stop offset="100%" stop-color="#07121e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bgHSE)"/>

  <!-- Technical HSE & Governance Shield & Environmental Terrain -->
  <g transform="translate(100, 80)">
    <!-- Contoured Terrain Rehabilitation Vectors -->
    <path d="M 0 460 Q 250 400 500 440 T 1000 390 L 1000 540 L 0 540 Z" fill="#0c1d2e"/>
    <path d="M 0 460 Q 250 400 500 440 T 1000 390" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

    <path d="M 0 500 Q 300 440 600 480 T 1000 430 L 1000 540 L 0 540 Z" fill="#081420"/>
    <path d="M 0 500 Q 300 440 600 480 T 1000 430" stroke="#16a34a" stroke-width="1" stroke-opacity="0.3" fill="none"/>

    <!-- Central Governance Emblem Frame -->
    <g transform="translate(380, 80)">
      <!-- Outer Hexagonal / Shield Perimeter -->
      <polygon points="120,0 240,70 240,230 120,300 0,230 0,70" fill="url(#shieldGrad)" stroke="#c98b2f" stroke-width="2"/>
      
      <!-- Inner Technical Ring -->
      <circle cx="120" cy="150" r="90" fill="none" stroke="#2d5f8a" stroke-width="1.5" stroke-dasharray="8 6"/>
      <circle cx="120" cy="150" r="75" fill="none" stroke="#4a7faa" stroke-width="1"/>

      <!-- Stylized Zero-Harm / Stewardship Emblem -->
      <!-- Shield Center Core -->
      <path d="M 120 90 L 170 120 L 170 170 Q 170 210 120 230 Q 70 210 70 170 L 70 120 Z" fill="#07121e" stroke="#e5be7e" stroke-width="2"/>
      
      <!-- Safe Environment / Ecological Leaf & Compass Vectors -->
      <path d="M 120 125 C 135 140 145 160 145 175 C 145 190 135 198 120 198 C 105 198 95 190 95 175 C 95 160 105 140 120 125 Z" fill="#16a34a" opacity="0.85"/>
      <line x1="120" y1="135" x2="120" y2="190" stroke="#bbf7d0" stroke-width="1.5"/>
    </g>

    <!-- Structural Grid Lines -->
    <line x1="100" y1="100" x2="300" y2="100" stroke="#234a6f" stroke-width="1"/>
    <line x1="100" y1="100" x2="100" y2="300" stroke="#234a6f" stroke-width="1"/>
    <line x1="700" y1="100" x2="900" y2="100" stroke="#234a6f" stroke-width="1"/>
    <line x1="900" y1="100" x2="900" y2="300" stroke="#234a6f" stroke-width="1"/>
  </g>
</svg>
